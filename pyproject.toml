[project]
name = "asrs-copilot"
version = "0.1.0"
description = "NLP over ASRS report narratives"
requires-python = ">=3.10"
dependencies = ["pandas", "scikit-learn", "transformers", "torch", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
